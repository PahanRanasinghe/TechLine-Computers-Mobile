services:
  - type: web
    name: techline-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # You will paste this in the Render dashboard
      - key: JWT_SECRET
        sync: false          # You will paste this in the Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: GEMINI_API_KEY
        sync: false          # You will paste this in the Render dashboard
